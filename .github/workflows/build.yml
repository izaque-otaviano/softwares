name: Build DMG

on:
  push:
    branches: [recorte]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache do Tesseract
        uses: actions/cache@v4
        with:
          path: vendor/tesseract
          key: tesseract-4.1.3-lept-1.82.0-x86_64-1014-v2
      - name: Compilar Tesseract (OCR para macOS 10.14)
        run: ./scripts/build_tesseract.sh
      - name: Rosetta (para testar a parte Intel)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Compilar e gerar DMG
        run: ./build.sh
      - name: Conferir versão mínima do binário Intel
        run: |
          lipo build/Recorte.app/Contents/MacOS/Recorte -thin x86_64 -output /tmp/recorte-x86
          otool -l /tmp/recorte-x86 | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX"
      - name: Conferir que o ScreenCaptureKit é opcional (o app abre no Mojave)
        run: |
          otool -l /tmp/recorte-x86 | grep -B1 -A2 ScreenCaptureKit | grep -E "cmd|name"
          otool -l /tmp/recorte-x86 | grep -B2 ScreenCaptureKit | grep -q LC_LOAD_WEAK_DYLIB && echo "ScreenCaptureKit: vínculo fraco (ok)" || echo "ScreenCaptureKit: vínculo FORTE (problema no Mojave)"
      - name: Instalar BlackHole e direcionar o som para ele (teste de áudio)
        continue-on-error: true
        run: |
          brew install --cask blackhole-2ch || true
          brew install switchaudio-osx || true
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -a -t output || true
          SwitchAudioSource -t output -s "BlackHole 2ch" || true
          SwitchAudioSource -t input -s "BlackHole 2ch" || true
          SwitchAudioSource -c -t output || true
      - name: Teste do gravador — caminho moderno (ScreenCaptureKit)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          mkdir -p screenshots
          open -a Preview "$PWD/scripts/sample.png"; sleep 4
          ( sleep 5; screencapture -x screenshots/gravando.png ) &
          RECORTE_TEST=record RECORTE_TEST_MIC_BLACKHOLE=1 "$APPBIN" 2>&1 | grep --line-buffered -v "IOServiceMatching" | tee rec-modern.log
          osascript -e 'quit app "Preview"' || true
          VIDEO=/tmp/recorte-ultimo.mp4; [ -f "$VIDEO" ] || VIDEO=""
          echo "Vídeo para a prévia: $VIDEO"
          if [ -n "$VIDEO" ]; then
            RECORTE_DEMO=preview RECORTE_DEMO_VIDEO="$VIDEO" "$APPBIN" & PID=$!
            sleep 7; screencapture -x screenshots/previa.png; kill $PID || true
          fi
          open -a Preview "$PWD/scripts/sample.png"; sleep 3
          RECORTE_DEMO=recbar "$APPBIN" & PID=$!
          sleep 6; screencapture -x screenshots/barra-gravacao.png; kill $PID || true
          osascript -e 'quit app "Preview"' || true
          RECORTE_DEMO=recarea RECORTE_DEMO_IMAGE="$PWD/scripts/sample.png" "$APPBIN" & PID=$!
          sleep 6; screencapture -x screenshots/area-gravacao.png; kill $PID || true
          RECORTE_DEMO=prefsrec "$APPBIN" & PID=$!
          sleep 7; screencapture -x screenshots/prefs-gravacao.png; kill $PID || true
      - name: Teste do envio ao Convertize Desk (servidor local) e da volta do login
        continue-on-error: true
        timeout-minutes: 3
        run: |
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          python3 scripts/desk_test_server.py > desk-server.log 2>&1 &
          sleep 2
          RECORTE_TEST=desk RECORTE_TEST_DESK_TOKEN=token-de-teste RECORTE_DEMO_IMAGE="$PWD/scripts/sample.png" "$APPBIN" 2>&1 | grep --line-buffered -v IOService
          sleep 1; cat desk-server.log
          RECORTE_TEST=deskblock RECORTE_TEST_DESK_TOKEN=token-de-teste "$APPBIN" 2>&1 | grep --line-buffered -v IOService
          RECORTE_TEST=deskconfig RECORTE_TEST_DESK_TOKEN=token-de-teste "$APPBIN" 2>&1 | grep --line-buffered -v IOService
          sleep 1; tail -1 desk-server.log
          RECORTE_DEMO=prefsdesk "$APPBIN" & PID=$!
          sleep 7; screencapture -x screenshots/prefs-desk.png; kill $PID || true
          # /api/v1/me/ com um JWT de teste (aud desk-capturas)
          JWT=$(python3 -c "import base64,json,time;e=lambda d:base64.urlsafe_b64encode(json.dumps(d).encode()).decode().rstrip('=');print(e({'alg':'none'})+'.'+e({'aud':'desk-capturas','sub':'7','scope':'openid desk.capturas','iss':'https://auth.convertize.com.br','exp':int(time.time())+3600})+'.x')")
          RECORTE_TEST=deskme RECORTE_TEST_DESK_TOKEN="$JWT" "$APPBIN" 2>&1 | grep --line-buffered -v IOService
          RECORTE_TEST_DESK_TOKEN="$JWT" RECORTE_DEMO=prefsdeskme "$APPBIN" & PID=$!
          sleep 8; screencapture -x screenshots/prefs-desk-me.png; kill $PID || true
          # Login: o app sobe 127.0.0.1:<porta>/callback; simulamos a volta do navegador.
          RECORTE_TEST=login "$APPBIN" > login.log 2>&1 &
          sleep 4
          URL=$(grep -o "https://auth[^ ]*" login.log | head -1)
          echo "Autorização: $URL" | cut -c1-200
          PORT=$(echo "$URL" | python3 -c "import sys,urllib.parse as u;q=u.parse_qs(u.urlsplit(sys.stdin.read().strip()).query);print(u.urlsplit(q['redirect_uri'][0]).port)")
          STATE=$(echo "$URL" | python3 -c "import sys,urllib.parse as u;print(u.parse_qs(u.urlsplit(sys.stdin.read().strip()).query)['state'][0])")
          curl -s "http://127.0.0.1:$PORT/callback?code=codigo-falso&state=$STATE" | head -c 200; echo
          sleep 8; cat login.log | grep -v IOService
      - name: Teste do gravador — caminho do Mojave (AVFoundation + BlackHole, binário Intel)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          RECORTE_TEST=record RECORTE_FORCE_LEGACY=1 RECORTE_TEST_NO_MIC=1 arch -x86_64 "$APPBIN" 2>&1 | grep --line-buffered -v "IOServiceMatching" | tee rec-legacy.log
      - name: Teste de fonte indisponível (webcam sem câmera)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          RECORTE_TEST=record RECORTE_TEST_WEBCAM=1 RECORTE_TEST_MIC_BLACKHOLE=1 "$APPBIN" 2>&1 | grep --line-buffered -E "AVISO|RESULTADO|Câmeras|Arquivo|Duração" | tee rec-webcam.log
      - name: Teste de recuperação após encerramento inesperado
        continue-on-error: true
        timeout-minutes: 4
        run: |
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          RECORTE_TEST=crash RECORTE_TEST_MIC_BLACKHOLE=1 "$APPBIN" 2>&1 | grep --line-buffered -v "IOServiceMatching" | tail -5 || true
          ls -la "$HOME/Library/Application Support/Recorte/Gravacoes/"*/ || true
          RECORTE_TEST=recover "$APPBIN" 2>&1 | grep --line-buffered -v "IOServiceMatching" | tee rec-recover.log
      - name: Testes do OCR (palavra única, tema escuro, texto longo)
        run: |
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          for f in scripts/ocr-tests/*.png; do
            case "$f" in *_2x.png) S=2;; *) S=1;; esac
            echo "--- $f (Vision)"; "$APPBIN" --ocr-file "$f" --scale $S | head -c 600; echo
            echo "--- $f (Tesseract)"; RECORTE_FORCE_TESSERACT=1 arch -x86_64 "$APPBIN" --ocr-file "$f" --scale $S | head -c 600; echo
          done
      - name: Prints automáticos do app
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          set -x
          mkdir -p screenshots
          APPBIN=build/Recorte.app/Contents/MacOS/Recorte
          shoot() {
            sleep 6
            screencapture -x "screenshots/$1.png" || true
          }
          for MODE in start select overlay tools pin toast prefs; do
            RECORTE_DEMO=$MODE RECORTE_DEMO_IMAGE="$PWD/scripts/sample.png" "$APPBIN" & PID=$!
            shoot $MODE
            kill $PID || true; sleep 1
          done
          # Sobre a tela real: abre a imagem no Preview e captura por cima
          open -a Preview "$PWD/scripts/sample.png"; sleep 5
          RECORTE_DEMO=live "$APPBIN" & PID=$!
          shoot live
          kill $PID || true; sleep 1
          RECORTE_DEMO=pick "$APPBIN" & PID=$!
          shoot pick
          kill $PID || true; sleep 1
          osascript -e 'quit app "Preview"' || true; sleep 1
          # OCR com o Vision (caminho do macOS 10.15+)
          RECORTE_DEMO=ocr RECORTE_DEMO_IMAGE="$PWD/scripts/sample_text.png" "$APPBIN" & PID=$!
          sleep 10; screencapture -x screenshots/ocr.png || true
          kill $PID || true; sleep 1
          # Copiar texto direto (sem painel): confere o que foi para a área de transferência
          echo -n "" | pbcopy
          RECORTE_DEMO=quicktext RECORTE_FORCE_TESSERACT=1 RECORTE_DEMO_IMAGE="$PWD/scripts/sample_text.png" arch -x86_64 "$APPBIN" & PID=$!
          sleep 20
          echo "=== Área de transferência após copiar texto direto ==="; pbpaste; echo; echo "==="
          kill $PID || true; sleep 1
          # OCR com o Tesseract, binário Intel (caminho do macOS 10.14)
          RECORTE_DEMO=ocr RECORTE_FORCE_TESSERACT=1 RECORTE_DEMO_IMAGE="$PWD/scripts/sample_text.png" arch -x86_64 "$APPBIN" & PID=$!
          sleep 25; screencapture -x screenshots/ocr-tesseract.png || true
          kill $PID || true
          ls -la screenshots
      - name: Salvar prints na branch
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Prints automáticos [skip ci]" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Recorte-dmg
          path: build/Recorte.dmg
      - name: Publicar release (em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/Recorte.dmg --title "Recorte ${GITHUB_REF_NAME}" --notes "Instalador para macOS 10.14 ou superior."
