name: Font Manager CI
# Compila e testa o Font Manager (fontmanager/) em Linux, Windows e macOS.
#  - Linux: núcleo Rust (SQLite, provedores, CSS, cache, ativação via fontconfig) + frontend.
#  - Windows / macOS: os mesmos testes + testes de integração REAIS da camada nativa
#    (AddFontResourceExW / Core Text) e compilação completa do app Tauri.
# Instaladores (.exe / .dmg): Actions > Font Manager CI > Run workflow (bundle = true).
on:
  push:
    paths: ['fontmanager/**', '.github/workflows/fontmanager-ci.yml']
  pull_request:
    paths: ['fontmanager/**', '.github/workflows/fontmanager-ci.yml']
  workflow_dispatch:
    inputs:
      bundle:
        description: Gerar instaladores (.exe/.dmg) como artefatos
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: fontmanager
jobs:
  linux:
    name: Linux (núcleo + frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: fontmanager }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Testes Rust (fm-native + fm-core)
        run: cargo test -p fm-native -p fm-core
        env: { FM_OS_TESTS: '1' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-15 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: as duas arquiteturas, para o DMG universal (Apple Silicon + Intel).
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: fontmanager }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Testes Rust (inclui integração real com o SO)
        run: cargo test -p fm-native -p fm-core -- --test-threads=1 --nocapture
        env: { FM_OS_TESTS: '1' }
      - run: npm ci
      - run: npm test
      - name: Compilar o app (sem instalador)
        if: ${{ !inputs.bundle }}
        run: npm run tauri -- build --no-bundle
      - name: Compilar instalador (Windows .exe)
        if: ${{ inputs.bundle && matrix.os == 'windows-latest' }}
        run: npm run tauri -- build --bundles nsis
      - name: Compilar instalador (macOS .dmg universal)
        if: ${{ inputs.bundle && matrix.os == 'macos-15' }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg
      - name: Conferir o DMG
        if: ${{ inputs.bundle && matrix.os == 'macos-15' }}
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          hdiutil verify "$dmg"
          # Monta o DMG e confere o app que o usuário vai arrastar para Aplicativos.
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          ls "$mnt"
          test -L "$mnt/Applications"            # atalho para arrastar e instalar
          app=$(ls -d "$mnt"/*.app | head -1)
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs=$(lipo -archs "$bin"); echo "arquiteturas: $archs"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          codesign -dv "$app" 2>&1 | head -5 || true
          hdiutil detach "$mnt" >/dev/null
          [[ $archs == *x86_64* && $archs == *arm64* ]]
          echo "### $(basename "$dmg") ($(du -h "$dmg" | cut -f1), universal)" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.bundle }}
        with:
          name: font-manager-${{ matrix.name }}
          path: |
            fontmanager/target/release/bundle/nsis/*.exe
            fontmanager/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
