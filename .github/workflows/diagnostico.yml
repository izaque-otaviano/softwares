name: Diagnóstico Desk

on:
  push:
    branches: [recorte]
    paths: [".github/workflows/diagnostico.yml"]
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Rotas de API usadas pelo site do Desk
        run: |
          B=https://desk.convertize.com.br
          curl -sS -m 20 "$B/" -o index.html
          grep -oE '(src|href)="/assets/[^"]+\.js"' index.html | sed -E 's/.*="([^"]+)"/\1/' | sort -u > js.txt
          cat js.txt
          : > all.js
          while read -r f; do curl -sS -m 30 "$B$f" >> all.js; echo >> all.js; done < js.txt
          # pedaços carregados sob demanda citados nos arquivos principais
          grep -oE 'assets/[A-Za-z0-9_.-]+\.js' all.js | sort -u | head -80 > more.txt
          while read -r f; do curl -sS -m 30 "$B/$f" >> all.js; echo >> all.js; done < more.txt
          wc -c all.js
          echo "--- caminhos /api/"
          grep -oE '["`]/?api/[A-Za-z0-9_/${}.:-]*' all.js | sort | uniq -c | sort -rn | head -80
          echo "--- menções a captura / upload / anexo"
          grep -oE '.{60}(captur|upload|anexo|attachment|multipart|FormData).{80}' all.js | head -40 | cut -c1-220
          echo "--- baseURL"
          grep -oE '.{40}baseURL.{80}' all.js | head -5
          for p in /api/captures/ /api/desk/capturas/ /api/uploads/ /api/attachments/ /api/files/ /api/health/ /api/me/; do
            echo "== POST $p: $(curl -sS -m 15 -X POST -o /dev/null -w '%{http_code}' "$B$p")  GET: $(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$B$p")"
          done
