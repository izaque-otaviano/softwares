[package]
name = "figcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft desktop app"
default-run = "figcraft"

[lints]
workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
webbrowser = { workspace = true }
image = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# The system's reduce-motion setting (UISettings.AnimationsEnabled), interface language
# (GlobalizationPreferences.Languages) and controllers for prototypes (Gaming.Input.Gamepad).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["UI_ViewManagement", "System_UserProfile", "Foundation_Collections", "Gaming_Input"] }

# The macOS menu bar (`src/mac_menu.rs`): muda (Tauri's menu crate, MIT OR Apache-2.0) wraps
# AppKit's NSMenu, so FigCraft's own crates stay free of `unsafe` and Objective-C.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
wat = { workspace = true }
# The key codes muda's accelerators take (its own dependency): the menu's keys name real ones.
keyboard-types = { version = "0.8", default-features = false }

[build-dependencies]
winresource = "0.1"
# The optional web viewer for "Export prototype as website" (FIGCRAFT_WEB_BUNDLE_DIR), deflated.
flate2 = { workspace = true }
