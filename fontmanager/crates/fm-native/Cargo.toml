[package]
name = "fm-native"
version.workspace = true
edition.workspace = true
description = "Camada nativa de registro de fontes (Windows GDI, macOS Core Text, Linux fontconfig)"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFURL", "CFError", "CFArray", "CFString"] }
objc2-core-text = { version = "0.3", features = ["CTFontManager", "CTFontManagerErrors"] }

[dev-dependencies]
tempfile = "3"
