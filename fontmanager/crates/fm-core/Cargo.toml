[package]
name = "fm-core"
version.workspace = true
edition.workspace = true
description = "Núcleo do Font Manager: banco SQLite, provedores, deduplicação, CSS, cache e ativação"

[dependencies]
fm-native = { path = "../fm-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
futures-util = "0.3"
async-trait = "0.1"
url = "2"
sha2 = "0.10"
hex = "0.4"
ttf-parser = "0.25"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "test-util"] }
